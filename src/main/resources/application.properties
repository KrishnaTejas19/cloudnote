spring.application.name=cloudnote
# "local" = H2 + disk (no AWS needed). Use SPRING_PROFILES_ACTIVE=prod on EC2.
spring.profiles.default=local
server.port=8080

# Upload limits (also enforced in code)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
cloudnote.max-file-bytes=5242880
cloudnote.max-attachments-per-note=5

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Only expose the health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Debug endpoint that logs an ERROR on purpose (for the CloudWatch alarm test). Off by default.
cloudnote.debug-endpoints=false
