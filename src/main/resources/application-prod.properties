# All values come from environment variables set in the systemd unit (see deploy/cloudnote.service).
# Example DB_URL: jdbc:mysql://<rds-endpoint>:3306/cloudnote
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Creates/updates tables on startup. Fine for a demo; use Flyway for anything long-lived.
spring.jpa.hibernate.ddl-auto=update

cloudnote.storage=s3
cloudnote.s3.bucket=${S3_BUCKET}
cloudnote.s3.region=${AWS_REGION:ap-south-1}

# Set to true only while testing the CloudWatch alarm (step 10), then turn off.
cloudnote.debug-endpoints=${DEBUG_ENDPOINTS:false}
